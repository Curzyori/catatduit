<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CatatDuit</title>
  <meta name="description" content="Pencatat keuangan offline. Tanpa akun, tanpa server, data di perangkat kamu.">
  <meta name="theme-color" content="#072033">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="screens" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <button class="nav-item" data-screen="beranda" aria-current="page">
      <span class="msr" aria-hidden="true">home</span><span class="nav-label">Beranda</span>
    </button>
    <button class="nav-item" data-screen="riwayat">
      <span class="msr" aria-hidden="true">history</span><span class="nav-label">Riwayat</span>
    </button>
    <button class="nav-center" data-screen="transaksi" aria-label="Catat transaksi">
      <span class="msr" aria-hidden="true">add</span>
    </button>
    <button class="nav-item" data-screen="laporan">
      <span class="msr" aria-hidden="true">description</span><span class="nav-label">Laporan</span>
    </button>
    <button class="nav-item" data-screen="pengaturan">
      <span class="msr" aria-hidden="true">settings</span><span class="nav-label">Pengaturan</span>
    </button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
